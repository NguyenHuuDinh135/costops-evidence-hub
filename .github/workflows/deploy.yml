name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend and Lambda zips
        run: bun run build
      - name: Upload frontend assets to Terraform-created S3 origin
        run: |
          if [ -d apps/web/.output/public ]; then
            WEB_DIR=apps/web/.output/public
          elif [ -d apps/web/dist ]; then
            WEB_DIR=apps/web/dist
          else
            echo "Cannot find built frontend output" >&2
            exit 1
          fi
          aws s3 sync "$WEB_DIR" "s3://${{ vars.FRONTEND_BUCKET }}" --delete
      - name: Update Lambda code packages
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.API_LAMBDA_NAME }}" \
            --zip-file fileb://apps/api/dist/api.zip
          aws lambda update-function-code \
            --function-name "${{ vars.COST_GUARD_LAMBDA_NAME }}" \
            --zip-file fileb://apps/api/dist/cost-guard.zip
          aws lambda update-function-code \
            --function-name "${{ vars.SECURITY_GUARD_LAMBDA_NAME }}" \
            --zip-file fileb://apps/api/dist/security-guard.zip
      - name: Print deployed endpoints
        run: |
          echo "Frontend: ${{ vars.FRONTEND_WEBSITE_URL }}"
          echo "API: ${{ vars.API_BASE_URL }}"
